# Daily bake and publish (bake.py, publish.py). adsb.lol publishes the previous UTC day's prod-0 release at about 03:26 UTC
# (published_at of the 2026-09 and 2026-10 releases), so this runs at 04:30 UTC. Nothing new: every later step does nothing.
# Order: bake -> Kaggle archive (the day's own dataset, verified) -> Hugging Face (adds the day; removes days older than
# HF_DAYS only once Kaggle lists today's and their datasets). A failed archive still publishes the day to HF, removes nothing.
# Re-bake a day (e.g. one whose archive failed; GitHub keeps adsb.lol's releases): run by hand with its tag.
# Each run commits status/last-run.json: GitHub turns schedules off after 60 days with no commits (live.yml relies on it too).
name: bake
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if the publish gate finds a count drop (a real drop, checked by hand)'
        type: boolean
        default: false
      tag:
        description: 'adsb.lol release tag to bake again (empty = the latest prod-0)'
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: bake
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PIPELINE_DATA: ${{ github.workspace }}/data
    steps:
      - name: free disk (preinstalled toolchains this job does not use)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      # streams the day's tar (~4 GB) through DuckDB batches; nothing to cache between runs
      - name: bake
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          BAKE_AGAIN: ${{ inputs.tag }}
        run: python bake.py $TAG
      # the archive: one public Kaggle dataset per day, created once, never versioned or deleted. Allowed to fail: publish then
      # adds the day to HF but removes nothing.
      - name: archive to Kaggle
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python kaggle_archive.py
      - name: publish
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          PUBLISH_FORCE: ${{ inputs.force && '1' || '0' }}
        run: set -o pipefail; mkdir -p status && python publish.py | tee status/last-run.json   # git keeps no empty folder: mkdir first
      - name: keep-alive commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/last-run.json
          git commit -m "bake $(date -u +%F)" || exit 0
          git pull --rebase -q && git push   # main may have moved during the run
